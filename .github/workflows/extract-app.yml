name: Extract Latest COE App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest COE ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'COE_Dummy_Matcher_*.zip' -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)

          if [ -z "$ZIP" ]; then
            echo "No COE_Dummy_Matcher_*.zip found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found latest ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Extract application
        if: steps.find_zip.outputs.found == 'true'
        shell: bash
        run: |
          ZIP="${{ steps.find_zip.outputs.zip }}"

          mkdir -p /tmp/coe_app

          echo "Extracting: $ZIP"
          unzip -o "$ZIP" -d /tmp/coe_app

          cp -r /tmp/coe_app/. .

          rm -f "$ZIP"

      - name: Commit extracted files
        if: steps.find_zip.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extract latest COE Dummy Matcher application"
            git push
          fi
